name: FinPilot CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finpilot
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: finpilot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpilot -d finpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      FINPILOT_DATABASE_URL: postgresql+asyncpg://finpilot:finpilot_dev@localhost:5432/finpilot
      FINPILOT_JWT_SECRET: ci-only-secret
      FINPILOT_ENVIRONMENT: test
      FINPILOT_OTP_TEST_CODE: "123456"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold in temporary project
        run: |
          flutter create --platforms=android --org com.hastronventures --project-name finpilot /tmp/finpilot_mobile
          rm -rf /tmp/finpilot_mobile/lib
          rm -rf /tmp/finpilot_mobile/test
          cp -R mobile/lib /tmp/finpilot_mobile/lib
          cp mobile/pubspec.yaml /tmp/finpilot_mobile/pubspec.yaml
      - name: Prepare biometric-compatible Android host
        run: |
          cat > /tmp/finpilot_mobile/android/app/src/main/kotlin/com/hastronventures/finpilot/MainActivity.kt <<'EOF'
          package com.hastronventures.finpilot

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity()
          EOF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' /tmp/finpilot_mobile/android/app/src/main/AndroidManifest.xml
      - name: Apply FinPilot release branding
        run: |
          mkdir -p /tmp/finpilot_mobile/android/app/src/main/res/drawable
          mkdir -p /tmp/finpilot_mobile/android/app/src/main/res/drawable-v21
          cat > /tmp/finpilot_mobile/android/app/src/main/res/drawable/finpilot_mark.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#124D40"
                  android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M31,30H77V41H43V50H70V61H43V79H31Z"/>
              <path
                  android:fillColor="#A9E4D5"
                  android:pathData="M62,50H77V61H62Z"/>
          </vector>
          EOF
          cat > /tmp/finpilot_mobile/android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#F3F6F5" />
                  </shape>
              </item>
              <item
                  android:width="120dp"
                  android:height="120dp"
                  android:gravity="center"
                  android:drawable="@drawable/finpilot_mark" />
          </layer-list>
          EOF
          cp /tmp/finpilot_mobile/android/app/src/main/res/drawable/launch_background.xml /tmp/finpilot_mobile/android/app/src/main/res/drawable-v21/launch_background.xml
          sed -i 's/android:label="finpilot"/android:label="FinPilot"/' /tmp/finpilot_mobile/android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/finpilot_mark"#' /tmp/finpilot_mobile/android/app/src/main/AndroidManifest.xml
      - name: Install Flutter dependencies
        working-directory: /tmp/finpilot_mobile
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: /tmp/finpilot_mobile
        run: flutter analyze --no-fatal-infos
      - name: Harden generated Android manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/finpilot_mobile/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          text = text.replace(
              "<application",
              '<application android:allowBackup="false" android:usesCleartextTraffic="false"',
              1,
          )
          p.write_text(text)
          PY
      - name: Build release validation AAB
        working-directory: /tmp/finpilot_mobile
        run: flutter build appbundle --release --dart-define=FINPILOT_API_BASE_URL=https://api.invalid/finpilot
      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finpilot-android-validation
          path: |
            /tmp/finpilot_mobile/android
            /tmp/finpilot_mobile/build/app/outputs/bundle/release/app-release.aab


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("backend/pyproject.toml").read_text())
          deps = data["project"]["dependencies"]
          Path("/tmp/finpilot-requirements.txt").write_text(
              "\n".join(deps) + "\n"
          )
          PY
          pip-audit -r /tmp/finpilot-requirements.txt

      - name: Static security scan for backend
        run: bandit -r backend/app -q -lll -iii

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit admin production dependencies
        working-directory: admin
        run: |
          npm install
          npm audit --omit=dev --audit-level=high
