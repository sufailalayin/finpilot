name: FinPilot Docker Smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t finpilot-backend ./backend

  admin-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build admin image
        run: docker build -t finpilot-admin ./admin
