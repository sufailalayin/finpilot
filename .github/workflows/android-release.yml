name: FinPilot Signed Android Release

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["FinPilot CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.1.0"
      version_code:
        description: "Version code, integer"
        required: true
        default: "2"

jobs:
  signed-android-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_commit.message, 'release:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="$INPUT_VERSION_NAME"
            CODE="$INPUT_VERSION_CODE"
          else
            VERSION="$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)"
            NAME="${VERSION%%+*}"
            CODE="${VERSION##*+}"
          fi
          test -n "$NAME"
          test -n "$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Select signing source
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.FINPILOT_API_BASE_URL || 'https://finpilot-backend-production-eaf5.up.railway.app/api/v1' }}
        run: |
          test -n "$API_BASE_URL" || (echo "Missing FINPILOT_API_BASE_URL" && exit 1)
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "mode=github" >> "$GITHUB_OUTPUT"
            echo "Using GitHub production signing secrets."
          else
            echo "mode=railway" >> "$GITHUB_OUTPUT"
            echo "GitHub signing secrets are unavailable; using the Railway signed builder fallback."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.mode == 'github'
        with:
          channel: stable

      - name: Generate Android project
        if: steps.signing.outputs.mode == 'github'
        run: |
          flutter create --platforms=android --org com.hastronventures --project-name finpilot /tmp/finpilot_release
          rm -rf /tmp/finpilot_release/lib
          rm -rf /tmp/finpilot_release/test
          cp -R mobile/lib /tmp/finpilot_release/lib
          cp mobile/pubspec.yaml /tmp/finpilot_release/pubspec.yaml

      - name: Apply release version
        if: steps.signing.outputs.mode == 'github'
        working-directory: /tmp/finpilot_release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text()
          text = re.sub(
              r"^version:\s*.*$",
              "version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}",
              text,
              flags=re.MULTILINE,
          )
          path.write_text(text)
          PY

      - name: Prepare biometric host and FinPilot branding
        if: steps.signing.outputs.mode == 'github'
        run: |
          cat > /tmp/finpilot_release/android/app/src/main/kotlin/com/hastronventures/finpilot/MainActivity.kt <<'EOF'
          package com.hastronventures.finpilot

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity()
          EOF

          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' /tmp/finpilot_release/android/app/src/main/AndroidManifest.xml

          mkdir -p /tmp/finpilot_release/android/app/src/main/res/drawable
          mkdir -p /tmp/finpilot_release/android/app/src/main/res/drawable-v21

          cat > /tmp/finpilot_release/android/app/src/main/res/drawable/finpilot_mark.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#124D40"
                  android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M31,30H77V41H43V50H70V61H43V79H31Z"/>
              <path
                  android:fillColor="#A9E4D5"
                  android:pathData="M62,50H77V61H62Z"/>
          </vector>
          EOF

          cat > /tmp/finpilot_release/android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#F3F6F5" />
                  </shape>
              </item>
              <item
                  android:width="120dp"
                  android:height="120dp"
                  android:gravity="center"
                  android:drawable="@drawable/finpilot_mark" />
          </layer-list>
          EOF

          cp /tmp/finpilot_release/android/app/src/main/res/drawable/launch_background.xml /tmp/finpilot_release/android/app/src/main/res/drawable-v21/launch_background.xml
          sed -i 's/android:label="finpilot"/android:label="FinPilot"/' /tmp/finpilot_release/android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/finpilot_mark"#' /tmp/finpilot_release/android/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/finpilot_release/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          text = text.replace(
              "<application",
              '<application android:allowBackup="false" android:usesCleartextTraffic="false"',
              1,
          )
          p.write_text(text)
          PY

      - name: Restore Android signing key
        if: steps.signing.outputs.mode == 'github'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/finpilot_release/android/app/upload-keystore.jks

          cat > /tmp/finpilot_release/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Configure release signing
        if: steps.signing.outputs.mode == 'github'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/finpilot_release/android/app/build.gradle.kts")
          text = path.read_text()

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          marker = "android {"
          insert = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          text = text.replace(marker, insert + marker, 1)

          text = text.replace(
              "    defaultConfig {",
              '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              defaultConfig {''',
              1,
          )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        if: steps.signing.outputs.mode == 'github'
        working-directory: /tmp/finpilot_release
        run: flutter pub get

      - name: Analyze
        if: steps.signing.outputs.mode == 'github'
        working-directory: /tmp/finpilot_release
        run: flutter analyze --no-fatal-infos

      - name: Build signed release APK
        if: steps.signing.outputs.mode == 'github'
        working-directory: /tmp/finpilot_release
        env:
          API_BASE_URL: ${{ vars.FINPILOT_API_BASE_URL || 'https://finpilot-backend-production-eaf5.up.railway.app/api/v1' }}
        run: >
          flutter build apk --release
          --dart-define=FINPILOT_API_BASE_URL="$API_BASE_URL"

      - name: Build signed release AAB
        if: steps.signing.outputs.mode == 'github'
        working-directory: /tmp/finpilot_release
        env:
          API_BASE_URL: ${{ vars.FINPILOT_API_BASE_URL || 'https://finpilot-backend-production-eaf5.up.railway.app/api/v1' }}
        run: >
          flutter build appbundle --release
          --dart-define=FINPILOT_API_BASE_URL="$API_BASE_URL"

      - name: Verify APK signature
        if: steps.signing.outputs.mode == 'github'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose /tmp/finpilot_release/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed Android artifacts
        if: steps.signing.outputs.mode == 'github'
        uses: actions/upload-artifact@v4
        with:
          name: finpilot-signed-android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          retention-days: 14
          path: |
            /tmp/finpilot_release/build/app/outputs/flutter-apk/app-release.apk
            /tmp/finpilot_release/build/app/outputs/bundle/release/app-release.aab


      - name: Sync release to Railway signing branch
        if: steps.signing.outputs.mode == 'railway'
        env:
          RAILWAY_SIGNING_BRANCH: build/direct-signed-finpilot-1.1.2
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RAILWAY_SIGNING_BRANCH"
          git switch -C railway-signer "origin/$RAILWAY_SIGNING_BRANCH"
          git merge --no-edit "$RELEASE_SHA"
          git push origin "HEAD:$RAILWAY_SIGNING_BRANCH"

      - name: Wait for Railway signed artifacts
        if: steps.signing.outputs.mode == 'railway'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILDER_BASE_URL: https://finpilot-signed-builder-production.up.railway.app
        run: |
          ready=0
          for attempt in $(seq 1 90); do
            info="$(curl -fsSL "$BUILDER_BASE_URL/BUILD_INFO.txt?run=$GITHUB_RUN_ID-$attempt" || true)"
            if printf '%s\n' "$info" | grep -qx "version_name=$VERSION_NAME" \
              && printf '%s\n' "$info" | grep -qx "version_code=$VERSION_CODE"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1" || (echo "Railway signed builder did not publish the requested version" && exit 1)

      - name: Download and verify Railway signed artifacts
        if: steps.signing.outputs.mode == 'railway'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILDER_BASE_URL: https://finpilot-signed-builder-production.up.railway.app
        run: |
          set -euo pipefail
          OUT=/tmp/railway-signed
          mkdir -p "$OUT"
          APK="FinPilot-$VERSION_NAME-build$VERSION_CODE-production.apk"
          AAB="FinPilot-$VERSION_NAME-build$VERSION_CODE-production.aab"

          curl -fsSL "$BUILDER_BASE_URL/$APK?run=$GITHUB_RUN_ID" -o "$OUT/$APK"
          curl -fsSL "$BUILDER_BASE_URL/$AAB?run=$GITHUB_RUN_ID" -o "$OUT/$AAB"
          curl -fsSL "$BUILDER_BASE_URL/SHA256SUMS.txt?run=$GITHUB_RUN_ID" -o "$OUT/SHA256SUMS.txt"
          curl -fsSL "$BUILDER_BASE_URL/BUILD_INFO.txt?run=$GITHUB_RUN_ID" -o "$OUT/BUILD_INFO.txt"

          expected_apk="$(grep "$APK" "$OUT/SHA256SUMS.txt" | awk '{print $1}')"
          expected_aab="$(grep "$AAB" "$OUT/SHA256SUMS.txt" | awk '{print $1}')"
          actual_apk="$(sha256sum "$OUT/$APK" | awk '{print $1}')"
          actual_aab="$(sha256sum "$OUT/$AAB" | awk '{print $1}')"

          test -n "$expected_apk"
          test -n "$expected_aab"
          test "$expected_apk" = "$actual_apk"
          test "$expected_aab" = "$actual_aab"

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$OUT/$APK"

      - name: Upload Railway signed Android artifacts
        if: steps.signing.outputs.mode == 'railway'
        uses: actions/upload-artifact@v4
        with:
          name: finpilot-signed-android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          retention-days: 14
          path: |
            /tmp/railway-signed/FinPilot-${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}-production.apk
            /tmp/railway-signed/FinPilot-${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}-production.aab
            /tmp/railway-signed/SHA256SUMS.txt
            /tmp/railway-signed/BUILD_INFO.txt
